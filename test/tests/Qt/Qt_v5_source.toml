# Build a static Qt5 from source with target-specific SSL configurations.

[Qt]
version = "5.12.9"
edition = "opensource"
configure_options = ["-opengl", "desktop"]

#[Qt.android]
#ssl = "openssl-linked"

[Qt.linux]
ssl = "openssl-runtime"

[Qt.macos]
ssl = "securetransport"

[Qt.win]
ssl = "openssl-linked"


[OpenSSL]
# Enable Android when OpenSSL v1.1.1 built from source is supported.
#enabled_targets = ["android", "linux", "win"]
enabled_targets = ["linux", "win"]

#[OpenSSL.android]
#version = "1.1.1g"

[OpenSSL.linux]
version = "1.1.1"
install_from_source = false

[OpenSSL.win]
version = "1.1.0l"


[Python]
version = "$PYTHON_VERSION"
